# Nginx server block for the portfolio, served next to your Discord bot on the
# same VPS. Sits behind Cloudflare in "Full (strict)" mode.
#
# Install:
#   sudo cp portfolio.nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before enabling the HTTPS block: generate a free Cloudflare Origin
# Certificate (Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create
# Certificate, 15-year validity) and save it as the two files referenced
# below. It only encrypts Cloudflare <-> VPS traffic — it will NOT be
# trusted by browsers directly, which is fine since visitors only ever hit
# Cloudflare's edge, never this cert.

# Replace with your actual domain everywhere below.
server {
    listen 80;
    server_name valentincombier.com www.valentincombier.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name valentincombier.com www.valentincombier.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    root /var/www/portfolio;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long cache for hashed build assets, none for the HTML entry point so
    # updates show up immediately instead of waiting out a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
