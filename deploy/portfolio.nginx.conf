# Nginx server block for the portfolio, served next to your Discord bot on the
# same VPS. Sits behind Cloudflare in "Full (strict)" mode.
#
# Install:
#   sudo cp portfolio.nginx.conf /etc/nginx/sites-available/portfolio
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp security-headers.conf /etc/nginx/snippets/portfolio-security-headers.conf
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before enabling the HTTPS block: generate a free Cloudflare Origin
# Certificate (Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create
# Certificate, 15-year validity) and save it as the two files referenced
# below. It only encrypts Cloudflare <-> VPS traffic — it will NOT be
# trusted by browsers directly, which is fine since visitors only ever hit
# Cloudflare's edge, never this cert.

# Zone de limitation pour le formulaire de contact. Doit être déclarée hors d'un
# bloc server : ce fichier est inclus depuis le bloc http de nginx.
#
# La clé est CF-Connecting-IP, pas $binary_remote_addr : derrière Cloudflare,
# l'adresse vue par nginx est celle du proxy, ce qui regrouperait tous les
# visiteurs dans un seul compteur. L'en-tête est fiable ici parce qu'ufw
# n'accepte 80/443 que depuis les plages Cloudflare.
limit_req_zone $http_cf_connecting_ip zone=contact:10m rate=10r/m;

# Replace with your actual domain everywhere below.
server {
    listen 80;
    server_name valentincombier.com www.valentincombier.com;
    return 301 https://$host$request_uri;
}

server {
    # Syntaxe historique volontairement conservée : `http2 on;` exige nginx
    # >= 1.25.1, alors qu'Ubuntu 22.04 livre 1.18 et 24.04 livre 1.24. Ici
    # c'est au pire un avertissement de dépréciation, jamais un échec au reload.
    listen 443 ssl http2;
    server_name valentincombier.com www.valentincombier.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    root /var/www/portfolio;
    index index.html;

    # N'annonce pas le numéro de version d'nginx dans Server: et les pages d'erreur.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Formulaire de contact : proxifié vers le service Node géré par PM2.
    # Installation dans server/contact/README.md.
    location = /api/contact {
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        limit_req zone=contact burst=3 nodelay;
        # 503 par défaut, que le front prendrait pour une panne de l'origine.
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host             $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # Long cache for hashed build assets, none for the HTML entry point so
    # updates show up immediately instead of waiting out a stale cache.
    location /assets/ {
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
