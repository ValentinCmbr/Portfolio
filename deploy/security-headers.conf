# En-têtes de sécurité partagés, inclus depuis CHAQUE bloc location.
#
# Pourquoi pas une seule fois au niveau `server` : nginx n'hérite pas des
# `add_header` d'un bloc parent dès que le bloc enfant en déclare un. Les deux
# `location` du portfolio posent leur propre `Cache-Control`, ce qui suffirait
# à faire disparaître silencieusement tous les en-têtes déclarés plus haut.
#
# `always` les applique aussi aux réponses d'erreur (404, 5xx), pas seulement
# aux 2xx/3xx.
#
# Note : Cloudflare ajoute déjà une partie de ces en-têtes. Un doublon est sans
# danger ici — deux CSP sont *intersectées* par le navigateur, donc le résultat
# est au moins aussi strict. Vérifier avec `curl -I` après déploiement.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS sans `preload` : voir la note dans deploy/README.md avant de l'ajouter.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
